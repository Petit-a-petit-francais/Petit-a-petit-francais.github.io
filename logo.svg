<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Petit à petit français">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset=".6" stop-color="#2f5fe6"/>
      <stop offset="1" stop-color="#1d3fb8"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".18"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bubble" gradientUnits="userSpaceOnUse" x1="0" y1="250" x2="0" y2="820">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#e9efff"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0b1f6b" flood-opacity=".35"/>
    </filter>
  </defs>
  <!-- app-icon tile -->
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="230" fill="url(#gloss)"/>
  <!-- speech bubble: speaking French -->
  <g filter="url(#lift)" fill="url(#bubble)">
    <rect x="196" y="250" width="632" height="440" rx="170"/>
    <path d="M300 600 C304 700 290 764 250 814 C346 806 424 764 476 676 Z"/>
  </g>
  <!-- three growing dots: little by little, in bleu-blanc-rouge -->
  <circle cx="352" cy="470" r="36" fill="#2f5fe6" opacity=".55"/>
  <circle cx="494" cy="470" r="48" fill="#2f5fe6"/>
  <circle cx="654" cy="470" r="62" fill="#ef4152"/>
</svg>
