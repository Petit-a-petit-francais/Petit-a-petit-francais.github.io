name: Bug
description: Something in the app is broken or behaves oddly.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where in the app?
      placeholder: e.g. Practice › Verb drills, Settings › Your progress
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. iPhone 16, Safari 26 / Windows 11, Edge
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in Settings › About.
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
